[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "repo2txt"
version = "3.0.0"
description = "Token-aware repository context selection for LLMs and coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nason Zikayo"}]
keywords = ["llm", "github", "repository", "context", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]

[project.scripts]
repo2txt = "repo2txt.cli:cli"

[project.urls]
Repository = "https://github.com/NasonZ/Repo2Txt"
Issues = "https://github.com/NasonZ/Repo2Txt/issues"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

